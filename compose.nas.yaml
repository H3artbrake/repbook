# Ready-built image from this repository's GitHub Actions workflow.
services:
  repbook:
    image: ${REPBOOK_IMAGE:-ghcr.io/h3artbrake/repbook:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS Tailscale address}
      COOKIE_SECURE: 'true'
    volumes:
      - repbook-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s

volumes:
  repbook-data:
