services:
  repbook:
    build: .
    image: repbook:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Set this to the exact HTTPS address printed by Tailscale Serve.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - repbook-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  repbook-data:
